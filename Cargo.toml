[workspace]
resolver = "3"
members = ["crates/proto", "crates/camera", "crates/videoipc", "crates/video-window", "crates/media", "crates/rpc", "crates/transcript", "crates/ffi", "crates/replay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
proto = { path = "crates/proto", package = "teams-redir-proto" }
rpc = { path = "crates/rpc", package = "teams-redir-rpc" }
transcript = { path = "crates/transcript", package = "teams-redir-transcript" }
media = { path = "crates/media", package = "teams-redir-media" }
camera = { path = "crates/camera", package = "teams-redir-camera" }
videoipc = { path = "crates/videoipc", package = "teams-redir-videoipc" }

# Debug builds of the JPEG decoder cannot keep up with a 720p camera, which makes the hardware
# tests miss frames.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.teams-redir-camera]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# See vendor/README.md.
[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc" }
webrtc-sys = { path = "vendor/webrtc-sys" }
