<text x="110.0" y="373.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Mic + speakers</text>
<text x="110.0" y="392.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">PipeWire /</text>
<text x="110.0" y="411.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">PulseAudio</text>
<rect x="200" y="346" width="140" height="84" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="270.0" y="383.0" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Webcam</text>
<text x="270.0" y="402.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">V4L2</text>
<rect x="360" y="346" width="140" height="84" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="430.0" y="373.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Video windows</text>
<text x="430.0" y="392.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">teams-redir-video</text>
<text x="430.0" y="411.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">(SDL3 helper)</text>
<line x1="110" y1="298" x2="110" y2="346" stroke="#3a3f4a" stroke-width="2.2" marker-end="url(#a3a3f4a)" marker-start="url(#s3a3f4a)"/>
