<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">Where the add-in sits</title><desc id="d">Teams runs in the Azure Virtual Desktop session. The add-in inside the FreeRDP client on the Linux machine answers its WebRTC calls over RDP virtual channels, and audio and video go straight from the Linux machine to the Teams service.</desc>
<defs><marker id="a2a58b5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a58b5"/></marker><marker id="s2a58b5" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2a58b5"/></marker><marker id="a3a3f4a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a3f4a"/></marker><marker id="s3a3f4a" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#3a3f4a"/></marker><marker id="a6b7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker><marker id="s6b7280" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#6b7280"/></marker><marker id="ac26f00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c26f00"/></marker><marker id="sc26f00" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#c26f00"/></marker></defs>
<rect width="1000" height="640" rx="12" fill="#ffffff"/>
<rect x="20" y="20" width="500" height="470" rx="16" fill="#e3edff" stroke="#3b6fd4" stroke-width="2"/>
<text x="38" y="48" font-size="16" font-weight="bold" fill="#3b6fd4" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Your Linux machine</text>
<rect x="620" y="20" width="360" height="470" rx="16" fill="#f1f1f1" stroke="#7a7a7a" stroke-width="2"/>
<text x="638" y="48" font-size="16" font-weight="bold" fill="#7a7a7a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">AVD session host (Cloud PC)</text>
<rect x="40" y="66" width="460" height="232" rx="12" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="56" y="90" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="start" font-family="Helvetica, Arial, sans-serif">FreeRDP client (sdl-freerdp)</text>
<rect x="60" y="104" width="420" height="178" rx="12" fill="#c9dcff" stroke="#2a58b5" stroke-width="1.6"/>
<text x="76" y="127" font-size="14" font-weight="bold" fill="#1d2430" text-anchor="start" font-family="Helvetica, Arial, sans-serif">teams-redir add-in (libteams-redir-client.so)</text>
<rect x="76" y="142" width="182" height="124" rx="10" fill="#e3edff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="167.0" y="180.0" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">C shim + Rust core</text>
<text x="167.0" y="199.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Answers Teams' WebRTC</text>
<text x="167.0" y="218.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">calls received over the</text>
<text x="167.0" y="237.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">virtual channels</text>
<rect x="282" y="142" width="182" height="124" rx="10" fill="#e3edff" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="373.0" y="180.0" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">libwebrtc</text>
<text x="373.0" y="199.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Calls, codecs, ICE,</text>
<text x="373.0" y="218.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">DTLS, jitter buffer,</text>
<text x="373.0" y="237.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">echo handling</text>
