<rect x="87.5" y="311.5" width="45.0" height="18.5" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="110" y="324" font-size="12.5" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">audio</text>
<rect x="244.0" y="311.5" width="52.0" height="18.5" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="270" y="324" font-size="12.5" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">frames</text>
<rect x="397.0" y="311.5" width="66.0" height="18.5" rx="4" fill="#ffffff" fill-opacity="0.92"/>
<text x="430" y="324" font-size="12.5" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">pictures</text>
<text x="40" y="462" font-size="12.5" font-weight="normal" fill="#566070" text-anchor="start" font-style="italic" font-family="Helvetica, Arial, sans-serif">Only this machine's mic, speakers and camera are used for the call.</text>
<rect x="640" y="66" width="320" height="104" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="800.0" y="103.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Microsoft Teams</text>
<text x="800.0" y="122.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The normal Teams app,</text>
<text x="800.0" y="141.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">running inside the session</text>
<rect x="640" y="236" width="320" height="104" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="800.0" y="273.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">WebRTC Redirector Service</text>
<text x="800.0" y="292.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Microsoft's component that forwards</text>
<text x="800.0" y="311.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Teams' WebRTC calls to the client</text>
<line x1="800" y1="170" x2="800" y2="236" stroke="#3a3f4a" stroke-width="2.2" marker-end="url(#a3a3f4a)" marker-start="url(#s3a3f4a)"/>
