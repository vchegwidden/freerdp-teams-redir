<text x="500.0" y="587.0" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Microsoft Teams service</text>
<text x="500.0" y="606.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Media relays and the other participants of the call</text>
<path d="M270 490 L270 560" fill="none" stroke="#c26f00" stroke-width="4" marker-end="url(#ac26f00)"/>
