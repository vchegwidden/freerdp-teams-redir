<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" role="img" aria-labelledby="t d">
<title id="t">Inside the add-in</title><desc id="d">Messages from the two virtual channels enter the C shim, pass through the C interface into the Rust core, whose single dispatcher thread drives the libwebrtc media engine, the camera, the tones and notifications, and a separate helper process that shows video in windows.</desc>
<defs><marker id="a3a3f4a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a3f4a"/></marker><marker id="s3a3f4a" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#3a3f4a"/></marker><marker id="ac26f00" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c26f00"/></marker><marker id="sc26f00" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#c26f00"/></marker></defs>
<rect width="1000" height="630" rx="12" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="56" rx="28" fill="#f1f1f1" stroke="#7a7a7a" stroke-width="1.6"/>
<text x="500.0" y="43.0" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">FreeRDP virtual channels</text>
<text x="500.0" y="62.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">com.microsoft.rdc.dvc.webrtc.1   and   com.microsoft.rdc.dvc.cpc.1</text>
<rect x="10" y="110" width="980" height="320" rx="16" fill="#e3edff" stroke="#3b6fd4" stroke-width="2"/>
<text x="28" y="138" font-size="15" font-weight="bold" fill="#3b6fd4" text-anchor="start" font-family="Helvetica, Arial, sans-serif"></text>
<text x="200" y="138" font-size="15" font-weight="bold" fill="#3b6fd4" text-anchor="start" font-family="Helvetica, Arial, sans-serif">libteams-redir-client.so: one library, loaded by FreeRDP with /dvc:teams-redir</text>
<rect x="20" y="150" width="150" height="100" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="95.0" y="185.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">C shim</text>
<text x="95.0" y="204.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">shim/shim.c</text>
<text x="95.0" y="223.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">DVCPluginEntry</text>
<rect x="210" y="150" width="150" height="100" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="285.0" y="185.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">C interface</text>
<text x="285.0" y="204.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">crates/ffi</text>
<text x="285.0" y="223.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">catches every panic</text>
<rect x="400" y="150" width="200" height="100" rx="10" fill="#c9dcff" stroke="#2a58b5" stroke-width="1.6"/>
<text x="500.0" y="176.0" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Rust core</text>
<text x="500.0" y="195.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Frames and parses messages;</text>
<text x="500.0" y="214.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">one dispatcher thread runs</text>
<text x="500.0" y="233.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">every Teams call (crates/rpc)</text>
<rect x="640" y="150" width="340" height="100" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="810.0" y="176.0" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Media engine (crates/media)</text>
<text x="810.0" y="195.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">libwebrtc via LiveKit's bindings:</text>
<text x="810.0" y="214.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">peer connections, codecs, ICE, DTLS,</text>
<text x="810.0" y="233.0" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">microphone capture and playout</text>
<line x1="170" y1="200" x2="210" y2="200" stroke="#3a3f4a" stroke-width="2.2" marker-end="url(#a3a3f4a)" marker-start="url(#s3a3f4a)"/>
