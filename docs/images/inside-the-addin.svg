<line x1="600" y1="200" x2="640" y2="200" stroke="#3a3f4a" stroke-width="2.2" marker-end="url(#a3a3f4a)" marker-start="url(#s3a3f4a)"/>
<rect x="400" y="300" width="200" height="90" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="500.0" y="330.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Tones + call alerts</text>
<text x="500.0" y="349.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">tones.rs, notify.rs,</text>
<text x="500.0" y="368.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">callalert.rs</text>
<rect x="670" y="300" width="135" height="90" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="737.5" y="330.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Camera capture</text>
<text x="737.5" y="349.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">crates/camera</text>
<text x="737.5" y="368.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">V4L2 to I420</text>
<rect x="825" y="300" width="155" height="90" rx="10" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.6"/>
<text x="902.5" y="330.5" font-size="15" font-weight="bold" fill="#1d2430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Video stream</text>
<text x="902.5" y="349.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">crates/videoipc</text>
<text x="902.5" y="368.5" font-size="13" font-weight="normal" fill="#566070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">to the helper</text>
<line x1="500" y1="250" x2="500" y2="300" stroke="#3a3f4a" stroke-width="2.2" marker-end="url(#a3a3f4a)" marker-start="url(#s3a3f4a)"/>
<line x1="737" y1="300" x2="737" y2="250" stroke="#3a3f4a" stroke-width="2.2" marker-end="url(#a3a3f4a)"/>
<line x1="902" y1="250" x2="902" y2="300" stroke="#3a3f4a" stroke-width="2.2" marker-end="url(#a3a3f4a)"/>
